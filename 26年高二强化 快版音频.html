        // ========== 渲染音频列表（无需修改） ==========
        function renderAudioList() {
            const audioListContainer = document.getElementById("audioList");
            // 清空容器（避免重复渲染）
            audioListContainer.innerHTML = "";

            // 遍历音频数组，生成播放器
            audioData.forEach((audioItem, index) => {
                const audioElement = document.createElement("div");
                audioElement.className = "audio-item";
                audioElement.innerHTML = `
                    <h3>${index + 1}. ${audioItem.title}</h3>
                    <audio controls preload="metadata">
                        <source src="${audioItem.url}" type="audio/mpeg">
                        你的浏览器不支持音频播放，请升级浏览器！
                    </audio>
                `;
                audioListContainer.appendChild(audioElement);
            });
        }

        // 页面加载完成后自动渲染音频列表
        window.onload = renderAudioList;
    </script>
